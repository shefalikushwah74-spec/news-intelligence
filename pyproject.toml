description = "AI-powered news summariser using Tavily, LangChain, Groq, and Streamlit"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tavily-python",
]
